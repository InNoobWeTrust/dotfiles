version = 1

[envs.core-utils]
channels = ["conda-forge"]
dependencies = { ripgrep = "*", fd-find = "*", bat = "*", zoxide = "*", zsh-autosuggestions = "*", eza = "*", 7zip = "*", yazi = "*", git = "*", lazygit = "*", nvim = "*", starship = "*", coreutils = "*", tmux = "*", socat = "*", trash-cli = "*" }
exposed = { rg = "rg", fd = "fd", bat = "bat", zoxide = "zoxide", eza = "eza", 7z = "7z", 7za = "7za", 7zr = "7zr", 7zz = "7zz", yazi = "yazi", ya = "ya", git = "git", lazygit = "lazygit", nvim = "nvim", starship = "starship", sha256sum = "sha256sum", tmux = "tmux", socat = "socat", trash = "trash", trash-put = "trash-put", trash-list = "trash-list", trash-restore = "trash-restore", trash-empty = "trash-empty", trash-rm = "trash-rm" }

[envs.dev]
channels = ["conda-forge"]
# Keep kind/node and kubectl versions aligned with .config/kind/local.yaml.
# REA requires Node 24.11+; stay on the Node 24 release line.
# Expose ast-grep, not its sg alias (which collides with the Unix sg command).
dependencies = { gh = "*", act = "*", lazydocker = "*", k9s = "*", bun = "*", uv = "*", helix = "*", go = "*", nodejs = ">=24.11,<25", tailscale = "*", tailscaled = "*", typst = "*", kubernetes-kind = "0.33.*", kubernetes-client = "1.34.*", ast-grep = ">=0.51,<0.52" }
exposed = { gh = "gh", act = "act", lazydocker = "lazydocker", k9s = "k9s", bun = "bun", bunx = "bunx", uv = "uv", uvx = "uvx", hx = "hx", go = "go", node = "node", npm = "npm", npx = "npx", tailscale = "tailscale", tailscaled = "tailscaled", typst = "typst", kind = "kind", kubectl = "kubectl", ast-grep = "ast-grep" }

[envs.db]
channels = ["conda-forge"]
dependencies = { visidata = "*", harlequin = "*" }
exposed = { vd = "vd", visidata = "visidata", harlequin = "harlequin", hsql = "hsql" }

[envs.system-tools]
channels = ["conda-forge"]
dependencies = { btop = "*" }
exposed = { btop = "btop" }


###############################################################################
# Optional environments in bootstrap.sh
# manual `pixi global sync` still requires the below environments
###############################################################################
[envs.lsps]
channels = ["conda-forge"]
# Typst, Rust, Python, JS/TS, shell, TOML, YAML, and web/config languages.
# Include TypeScript itself for typescript-language-server; keep Node on the dev release line.
dependencies = { tinymist = "*", rust-analyzer = "*", ty = "*", ruff = "*", typescript-language-server = "*", typescript = "*", nodejs = ">=22,<25", bash-language-server = "*", shellcheck = "*", yaml-language-server = "*", taplo = "*", vscode-langservers-extracted = "*" }
exposed = { tinymist = "tinymist", rust-analyzer = "rust-analyzer", ty = "ty", ruff = "ruff", typescript-language-server = "typescript-language-server", bash-language-server = "bash-language-server", shellcheck = "shellcheck", yaml-language-server = "yaml-language-server", taplo = "taplo", vscode-json-language-server = "vscode-json-language-server", vscode-html-language-server = "vscode-html-language-server", vscode-css-language-server = "vscode-css-language-server", vscode-eslint-language-server = "vscode-eslint-language-server", vscode-markdown-language-server = "vscode-markdown-language-server" }

# Rust toolchain for building and running projects; the Rust analyzer stays in `lsps`.
# Include pkg-config + openssl so native crate builds (openssl-sys) resolve the
# environment's OpenSSL instead of falling through to Homebrew's.
[envs.rust]
channels = ["conda-forge"]
dependencies = { rust = "*", pkg-config = "*", openssl = "*" }
exposed = { cargo = "cargo", rustc = "rustc" }
