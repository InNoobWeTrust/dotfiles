version = 1

[envs.core-utils]
channels = ["conda-forge"]
dependencies = { ripgrep = "*", fd-find = "*", bat = "*", zoxide = "*", eza = "*", 7zip = "*", yazi = "*", git = "*", lazygit = "*", nvim = "*", starship = "*", coreutils = "*", tmux = "*", socat = "*", trash-cli = "*" }
exposed = { rg = "rg", fd = "fd", bat = "bat", zoxide = "zoxide", eza = "eza", 7z = "7z", 7za = "7za", 7zr = "7zr", 7zz = "7zz", yazi = "yazi", ya = "ya", git = "git", lazygit = "lazygit", nvim = "nvim", starship = "starship", sha256sum = "sha256sum", tmux = "tmux", socat = "socat", trash = "trash", trash-put = "trash-put", trash-list = "trash-list", trash-restore = "trash-restore", trash-empty = "trash-empty", trash-rm = "trash-rm" }

[envs.dev]
channels = ["conda-forge"]
# Keep kind/node and kubectl versions aligned with .config/kind/local.yaml.
# REA requires Node 24.11+; stay on the Node 24 release line.
dependencies = { gh = "*", act = "*", lazydocker = "*", k9s = "*", bun = "*", uv = "*", helix = "*", go = "*", nodejs = ">=24.11,<25", tailscale = "*", tailscaled = "*", typst = "*", kubernetes-kind = "0.33.*", kubernetes-client = "1.34.*" }
exposed = { gh = "gh", act = "act", lazydocker = "lazydocker", k9s = "k9s", bun = "bun", bunx = "bunx", uv = "uv", uvx = "uvx", hx = "hx", go = "go", node = "node", npm = "npm", npx = "npx", tailscale = "tailscale", tailscaled = "tailscaled", typst = "typst", kind = "kind", kubectl = "kubectl" }

[envs.db]
channels = ["conda-forge"]
dependencies = { visidata = "*", harlequin = "*" }
exposed = { vd = "vd", visidata = "visidata", harlequin = "harlequin", hsql = "hsql" }
