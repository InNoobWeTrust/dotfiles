# Instance drop-in for the packaged openfortivpn@.service; see README.md.
[Unit]
# Idle SAML timeouts are expected; keep re-arming until explicitly stopped.
StartLimitIntervalSec=0

[Service]
# Avoid missing READY notifications in builds without systemd support.
# Active means the process is running, not that the tunnel is authenticated.
Type=exec
Restart=always
RestartSec=2s
