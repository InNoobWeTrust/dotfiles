# Shared-home CLI environment alongside a host-managed kind cluster.
# Requires Distrobox and rootless Podman. No nested engine, VM, or KVM required.
# Distrobox shares host resources and is not a security sandbox.
# Source: https://distrobox.it/usage/distrobox-assemble/
#
# From this repository:
#   DBX_CONTAINER_MANAGER=podman distrobox assemble create --file .config/distrobox/main-box.ini
#   distrobox enter main-box
# After stowing, use ~/.config/distrobox/main-box.ini instead.
# Re-running assemble preserves an existing main-box (replace=false).
#
# Install host CLI tools from the updated, stowed Pixi global manifest:
#   pixi global sync
# Run cluster commands in a HOST shell, as your normal user:
#   podman info
# Confirm rootless: true and cgroupVersion: v2, then:
#   KIND_EXPERIMENTAL_PROVIDER=podman kind create cluster --name local --config .config/kind/local.yaml --wait 120s
# After stowing, use ~/.config/kind/local.yaml instead.
#   kubectl --context kind-local get nodes
# Expected: one Ready control-plane node, also visible in podman ps.
# kind updates your kubeconfig with kind-local; existing contexts remain.
#
# If kind reports missing cgroup delegation, run from the host instead:
#   KIND_EXPERIMENTAL_PROVIDER=podman systemd-run --scope --user -p Delegate=yes kind create cluster --name local --config .config/kind/local.yaml --wait 120s
# Other rootless networking/log/PID/inotify caveats:
#   https://kind.sigs.k8s.io/docs/user/rootless/
# No host sysctl, logging, or service settings are changed by this manifest.
#
# Inside main-box, explicitly invoke host tools when needed:
#   distrobox-host-exec podman ps
#   distrobox-host-exec kubectl --context kind-local get nodes
# Do not install/run a container-local Podman engine for these workflows.
# For VS Code running on the host (or Remote-SSH to it), set:
#   "dev.containers.dockerPath": "podman"
# No global DOCKER_HOST or per-devcontainer engine socket mount is needed.
#
# kind nodes use host Podman; pods use containerd inside those nodes.
# Podman images are not automatically shared with Kubernetes:
#   KIND_EXPERIMENTAL_PROVIDER=podman kind load image-archive image.tar --name local
# Remove only this cluster (also removes its node-local workload data):
#   KIND_EXPERIMENTAL_PROVIDER=podman kind delete cluster --name local

[main-box]
image=registry.fedoraproject.org/fedora-toolbox:44
root=false
init=false
pull=true
replace=false
start_now=true
additional_packages="git curl ca-certificates less"
