# Example local task: connect to the WebDriver endpoint at http://127.0.0.1:4444.
# See README.md for requirements.
[tasks.test-pressing]
env = { "LOG_LEVEL" = "debug" }
command = "cargo"
args = [
  "run",
  "--",
  "-f",
  "test.txt",
  "--logfile",
  "test.log",
  "-w",
  "5m",
  "-t",
  "15m",
]
