model = "forbiddengun/qwen"
model_provider = "ckey"

# Native command isolation; escalation requires an explicit user decision.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
allow_login_shell = true

[sandbox_workspace_write]
network_access = true

[model_providers.ckey]
name = "CKey"
base_url = "https://api.xah.io/v1"
wire_api = "responses"
env_key = "CKEY_API_KEY"
requires_openai_auth = false
supports_websockets = true
model_catalog_url = "https://api.xah.io/v1/models"

[tui]
screen_reader_detection_done = true
theme = "gruvbox-dark"

[mcp_servers.sandbox]
command = "mcp-sandbox"
