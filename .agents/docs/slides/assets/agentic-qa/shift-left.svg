<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0f172a"/>

  <!-- Title -->
  <text x="640" y="52" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" fill="#e2e8f0" font-weight="700">Shift-Left Testing</text>
  <text x="640" y="88" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#94a3b8">Catch issues earlier — when they are cheaper to understand and fix</text>

  <!-- Instruction banner (no arc through it) -->
  <rect x="180" y="120" width="920" height="56" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="640" y="156" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#e2e8f0" font-weight="700">Move checks left: design · unit · contract · static</text>

  <!-- Direction arrow under banner -->
  <defs>
    <marker id="shiftArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#86efac"/>
    </marker>
  </defs>
  <line x1="980" y1="210" x2="300" y2="210" stroke="#86efac" stroke-width="5" marker-end="url(#shiftArrow)"/>
  <text x="640" y="245" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#86efac">earlier in the lifecycle</text>

  <!-- Cost labels ABOVE stages, clear of arrow -->
  <text x="200" y="300" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#86efac" font-weight="700">cheapest fix</text>
  <text x="1080" y="300" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#fca5a5" font-weight="700">most expensive</text>

  <!-- Timeline -->
  <line x1="100" y1="420" x2="1180" y2="420" stroke="#cbd5e1" stroke-width="6"/>
  <polygon points="1180,420 1140,400 1140,440" fill="#cbd5e1"/>

  <!-- Stages -->
  <circle cx="200" cy="420" r="62" fill="#22c55e"/>
  <text x="200" y="415" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#052e16" font-weight="700">design</text>
  <text x="200" y="442" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#052e16">review</text>

  <circle cx="420" cy="420" r="62" fill="#38bdf8"/>
  <text x="420" y="428" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#082f49" font-weight="700">code</text>

  <circle cx="640" cy="420" r="62" fill="#f59e0b"/>
  <text x="640" y="428" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#111827" font-weight="700">PR</text>

  <circle cx="860" cy="420" r="62" fill="#fb7185"/>
  <text x="860" y="428" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#4c0519" font-weight="700">staging</text>

  <circle cx="1080" cy="420" r="62" fill="#ef4444"/>
  <text x="1080" y="428" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#ffffff" font-weight="700">prod</text>

  <!-- Stage order labels under circles -->
  <text x="200" y="520" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#94a3b8">early</text>
  <text x="1080" y="520" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#94a3b8">late</text>

  <!-- Footer -->
  <text x="640" y="600" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#cbd5e1">Agents help only if they join the early loop</text>
  <text x="640" y="640" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#94a3b8">Testing only after long generation is shift-right with better marketing</text>
</svg>
