<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="58" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" fill="#e2e8f0" font-weight="700">Promotion Ladder</text>
  <text x="640" y="96" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#94a3b8">Escalate only when more rigor is worth the cost</text>

  <!-- steps bottom to top, left to right rising -->
  <rect x="80" y="540" width="280" height="80" rx="16" fill="#38bdf8"/>
  <text x="220" y="590" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#082f49" font-weight="700">1. heuristic review</text>

  <rect x="220" y="450" width="300" height="80" rx="16" fill="#22c55e"/>
  <text x="370" y="500" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#052e16" font-weight="700">2. spot check + evidence</text>

  <rect x="360" y="360" width="320" height="80" rx="16" fill="#f59e0b"/>
  <text x="520" y="410" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#111827" font-weight="700">3. structured audit</text>

  <rect x="520" y="270" width="300" height="80" rx="16" fill="#fb7185"/>
  <text x="670" y="320" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#4c0519" font-weight="700">4. scenario pack</text>

  <rect x="680" y="180" width="340" height="80" rx="16" fill="#a78bfa"/>
  <text x="850" y="230" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#2e1065" font-weight="700">5. durable automation</text>

  <rect x="860" y="90" width="300" height="80" rx="16" fill="#e2e8f0"/>
  <text x="1010" y="140" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="700">6. CI / release pack</text>

  <!-- cost note -->
  <text x="160" y="200" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#86efac">
    <tspan x="160" dy="0">lower cost</tspan>
    <tspan x="160" dy="28">faster start</tspan>
  </text>
  <text x="1120" y="300" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#fca5a5">
    <tspan x="1120" dy="0">higher cost</tspan>
    <tspan x="1120" dy="28">higher rigor</tspan>
    <tspan x="1120" dy="28">higher upkeep</tspan>
  </text>

  <text x="640" y="680" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#cbd5e1">Do not escalate by default</text>
</svg>
